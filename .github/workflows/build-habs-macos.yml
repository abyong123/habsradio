name: Build HABS macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [macos-broadcaster-v1]
    paths:
      - 'macos-src/**'
      - '.github/workflows/build-habs-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macos-src/**'
      - '.github/workflows/build-habs-macos.yml'

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Reconstruct and version macOS sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p macos-work
          cat macos-src/chunks/*.b64 | base64 --decode > macos-work/src.tar.gz
          tar -xzf macos-work/src.tar.gz -C macos-work
          test -f macos-work/app/main.go
          test -f macos-work/macos/HABSMacApp.swift
          test -f macos-work/macos/Info.plist
          python3 - <<'PY'
          from pathlib import Path
          swift = Path('macos-work/macos/HABSMacApp.swift')
          s = swift.read_text()
          s = s.replace('private let habsVersion = "0.9.0"', 'private let habsVersion = "0.9.2"')
          swift.write_text(s)
          plist = Path('macos-work/macos/Info.plist')
          p = plist.read_text()
          p = p.replace('<key>CFBundleShortVersionString</key><string>0.9.0</string>', '<key>CFBundleShortVersionString</key><string>0.9.2</string>')
          p = p.replace('<key>CFBundleVersion</key><string>900</string>', '<key>CFBundleVersion</key><string>902</string>')
          plist.write_text(p)
          PY

      - name: Static feature and JavaScript checks
        shell: bash
        run: |
          set -euxo pipefail
          test -f macos-work/app/web/index.html
          test -f macos-work/app/web/app.js
          test -f macos-work/app/web/dj.js
          test -f macos-work/app/web/multistream.js
          test -f macos-work/app/web/linked-music.js
          grep -qi 'DJ STUDIO' macos-work/app/web/index.html
          grep -qi 'AutoDJ' macos-work/app/web/index.html
          grep -qi 'LINKED MUSIC' macos-work/app/web/index.html
          grep -qi 'YOUTUBE' macos-work/app/web/index.html
          grep -qi 'Spotify' macos-work/app/web/linked-music.js
          node --check macos-work/app/web/app.js
          node --check macos-work/app/web/dj.js
          node --check macos-work/app/web/multistream.js
          node --check macos-work/app/web/linked-music.js

      - name: Test Go backend
        shell: bash
        run: |
          set -euxo pipefail
          cd macos-work/app
          go test ./...

      - name: Build Universal Go backend
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          cd macos-work/app
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../../build/HABSBackend_x86_64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../../build/HABSBackend_arm64 .
          cd ../..
          lipo -create build/HABSBackend_x86_64 build/HABSBackend_arm64 -output build/HABSBackend
          lipo -info build/HABSBackend

      - name: Smoke test backend in Mac headless mode
        shell: bash
        run: |
          set -euxo pipefail
          rm -f build/backend-smoke.url build/backend-smoke.log
          chmod +x build/HABSBackend
          HABS_HEADLESS=1 HABS_URL_FILE="$PWD/build/backend-smoke.url" HABS_NATIVE_BRIDGE_TOKEN='ci-smoke-token' ./build/HABSBackend > build/backend-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            [ -s build/backend-smoke.url ] && break
            if ! kill -0 "$PID" 2>/dev/null; then
              cat build/backend-smoke.log || true
              exit 1
            fi
            sleep 0.1
          done
          test -s build/backend-smoke.url
          URL="$(tr -d '\r\n' < build/backend-smoke.url)"
          echo "Backend URL: $URL"
          curl --fail --silent --show-error --max-time 5 "$URL/api/info" | tee build/backend-info.json
          curl --fail --silent --show-error --max-time 5 "$URL/" -o build/backend-index.html
          grep -qi 'HABS' build/backend-index.html
          kill "$PID" || true
          wait "$PID" || true
          trap - EXIT

      - name: Build Universal native Mac app
        shell: bash
        run: |
          set -euxo pipefail
          SWIFT='macos-work/macos/HABSMacApp.swift'
          COMMON=(-O -framework Cocoa -framework WebKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreAudio -framework AudioToolbox -framework CoreGraphics)
          xcrun swiftc "${COMMON[@]}" -target x86_64-apple-macos13.0 "$SWIFT" -o 'build/HABS Broadcaster_x86_64'
          xcrun swiftc "${COMMON[@]}" -target arm64-apple-macos13.0 "$SWIFT" -o 'build/HABS Broadcaster_arm64'
          lipo -create 'build/HABS Broadcaster_x86_64' 'build/HABS Broadcaster_arm64' -output 'build/HABS Broadcaster'
          lipo -info 'build/HABS Broadcaster'

      - name: Bundle application
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/HABS Broadcaster.app'
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp 'build/HABS Broadcaster' "$APP/Contents/MacOS/HABS Broadcaster"
          cp build/HABSBackend "$APP/Contents/Resources/HABSBackend"
          cp macos-work/macos/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/HABS Broadcaster" "$APP/Contents/Resources/HABSBackend"

          rm -rf build/iconwork build/HABS.iconset
          mkdir -p build/iconwork build/HABS.iconset
          qlmanage -t -s 1024 -o build/iconwork macos-work/app/web/habs-icon.svg >/dev/null 2>&1 || true
          PNG="$(find build/iconwork -type f -name '*.png' | head -1 || true)"
          if [ -n "$PNG" ]; then
            sips -z 16 16 "$PNG" --out build/HABS.iconset/icon_16x16.png >/dev/null
            sips -z 32 32 "$PNG" --out build/HABS.iconset/icon_16x16@2x.png >/dev/null
            sips -z 32 32 "$PNG" --out build/HABS.iconset/icon_32x32.png >/dev/null
            sips -z 64 64 "$PNG" --out build/HABS.iconset/icon_32x32@2x.png >/dev/null
            sips -z 128 128 "$PNG" --out build/HABS.iconset/icon_128x128.png >/dev/null
            sips -z 256 256 "$PNG" --out build/HABS.iconset/icon_128x128@2x.png >/dev/null
            sips -z 256 256 "$PNG" --out build/HABS.iconset/icon_256x256.png >/dev/null
            sips -z 512 512 "$PNG" --out build/HABS.iconset/icon_256x256@2x.png >/dev/null
            sips -z 512 512 "$PNG" --out build/HABS.iconset/icon_512x512.png >/dev/null
            sips -z 1024 1024 "$PNG" --out build/HABS.iconset/icon_512x512@2x.png >/dev/null
            iconutil -c icns build/HABS.iconset -o "$APP/Contents/Resources/HABS.icns"
          else
            /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconFile' "$APP/Contents/Info.plist" || true
          fi

      - name: Verify bundle layout and architecture
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/HABS Broadcaster.app'
          test -x "$APP/Contents/MacOS/HABS Broadcaster"
          test -x "$APP/Contents/Resources/HABSBackend"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist" | grep -Fx 'HABS Broadcaster'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'com.habsradio.broadcaster'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | grep -Fx '0.9.2'
          lipo -archs "$APP/Contents/MacOS/HABS Broadcaster" | grep -q 'x86_64 arm64\|arm64 x86_64'
          lipo -archs "$APP/Contents/Resources/HABSBackend" | grep -q 'x86_64 arm64\|arm64 x86_64'
          plutil -lint "$APP/Contents/Info.plist"

      - name: Ad-hoc sign and verify
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/HABS Broadcaster.app'
          codesign --force --sign - --timestamp=none "$APP/Contents/Resources/HABSBackend"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee build/codesign-info.txt
          spctl --assess --type execute --verbose=4 "$APP" > build/gatekeeper-assessment.txt 2>&1 || true
          cat build/gatekeeper-assessment.txt

      - name: Launch packaged app and verify embedded backend
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/HABS Broadcaster.app'
          SUPPORT="$HOME/Library/Application Support/HABS Broadcaster"
          mkdir -p "$SUPPORT"
          rm -f "$SUPPORT"/backend-*.url
          open -n "$APP"
          URLFILE=''
          for i in $(seq 1 150); do
            URLFILE="$(find "$SUPPORT" -maxdepth 1 -type f -name 'backend-*.url' -print -quit 2>/dev/null || true)"
            [ -n "$URLFILE" ] && [ -s "$URLFILE" ] && break
            sleep 0.1
          done
          if [ -z "$URLFILE" ] || [ ! -s "$URLFILE" ]; then
            echo 'The .app launched but its embedded backend URL never appeared.'
            cat "$SUPPORT/mac-backend.log" || true
            ps aux | grep -E 'HABS Broadcaster|HABSBackend' | grep -v grep || true
            exit 1
          fi
          URL="$(tr -d '\r\n' < "$URLFILE")"
          echo "Packaged app backend URL: $URL"
          curl --fail --silent --show-error --max-time 5 "$URL/api/info" | tee build/app-runtime-info.json
          curl --fail --silent --show-error --max-time 5 "$URL/" -o build/app-runtime-index.html
          grep -qi 'HABS' build/app-runtime-index.html
          pgrep -f 'HABS Broadcaster.app/Contents/MacOS/HABS Broadcaster' >/dev/null
          pgrep -f 'HABS Broadcaster.app/Contents/Resources/HABSBackend' >/dev/null
          pkill -f 'HABS Broadcaster.app/Contents/MacOS/HABS Broadcaster' || true
          pkill -f 'HABS Broadcaster.app/Contents/Resources/HABSBackend' || true
          sleep 1

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/dmgroot build/dmgmount
          mkdir -p build/dmgroot build/dmgmount
          ditto 'build/HABS Broadcaster.app' 'build/dmgroot/HABS Broadcaster.app'
          ln -s /Applications build/dmgroot/Applications
          cat > 'build/dmgroot/Read Me First.txt' <<'TXT'
          HABS Broadcaster for macOS v0.9.2

          1. Drag HABS Broadcaster.app to Applications.
          2. This test build is ad-hoc signed. If macOS says the developer cannot be verified, Control-click HABS Broadcaster in Applications, choose Open, then choose Open once. Do not disable Gatekeeper.
          3. Allow Microphone and Screen Recording/System Audio permissions when macOS asks. Screen Recording permission can require quitting and reopening HABS Broadcaster once.

          A Developer ID signed + Apple-notarized release will open normally without the unverified-developer first-open step.
          TXT
          hdiutil create -volname 'HABS Broadcaster' -srcfolder build/dmgroot -ov -format UDZO 'build/HABS_Broadcaster_macOS_v0.9.2.dmg'
          hdiutil verify 'build/HABS_Broadcaster_macOS_v0.9.2.dmg'
          hdiutil attach 'build/HABS_Broadcaster_macOS_v0.9.2.dmg' -nobrowse -readonly -mountpoint "$PWD/build/dmgmount"
          test -d 'build/dmgmount/HABS Broadcaster.app'
          test -L 'build/dmgmount/Applications'
          test -f 'build/dmgmount/Read Me First.txt'
          codesign --verify --deep --strict --verbose=2 'build/dmgmount/HABS Broadcaster.app'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/dmgmount/HABS Broadcaster.app/Contents/Info.plist' | grep -Fx '0.9.2'
          hdiutil detach "$PWD/build/dmgmount"
          shasum -a 256 'build/HABS_Broadcaster_macOS_v0.9.2.dmg' | tee build/SHA256SUMS.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HABS-Broadcaster-macOS-v0.9.2-Diagnostics
          path: |
            build/backend-smoke.log
            build/backend-info.json
            build/app-runtime-info.json
            build/codesign-info.txt
            build/gatekeeper-assessment.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HABS-Broadcaster-macOS-DMG-v0.9.2
          path: |
            build/HABS_Broadcaster_macOS_v0.9.2.dmg
            build/SHA256SUMS.txt
          retention-days: 14
